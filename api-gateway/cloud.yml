apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-gateway
  labels:
    cloud.googleapis.com/location: <REGION>
    app.kubernetes.io/name: api-gateway
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT_ID>/<IMAGE_REPOSITORY>/api-gateway:<IMAGE_TAG>
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
            - name: CONTENT_SERVICE_URL
              value: "<DEPLOYED_CONTENT_SERVICE_URL>"
            - name: BUSINESS_SERVICE_URL
              value: "<DEPLOYED_BUSINESS_SERVICE_URL>"
            - name: CONTACT_SERVICE_URL
              value: "<DEPLOYED_CONTACT_SERVICE_URL>"
