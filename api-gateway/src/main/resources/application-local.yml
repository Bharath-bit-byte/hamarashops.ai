spring:
  cloud:
    gateway:
      routes:
        # Route 1: Content Service
        - id: content-service-routes
          uri: ${CONTENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/products,/api/v1/products/**,/api/v1/solutions,/api/v1/solutions/**,/api/v1/services,/api/v1/services/**,/api/v1/insights,/api/v1/insights/**,/api/v1/company,/api/v1/company/**,/api/v1/partners,/api/v1/partners/**,/api/v1/search,/api/v1/search/**,/api/v1/case-studies,/api/v1/case-studies/**,/api/v1/testimonials,/api/v1/testimonials/**,/api/v1/integrations,/api/v1/integrations/**,/api/v1/metrics,/api/v1/metrics/**,/api/v1/assistant,/api/v1/assistant/**

        # Route 2: Business Service
        - id: business-service-routes
          uri: ${BUSINESS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/industries,/api/v1/industries/**,/api/v1/careers,/api/v1/careers/**

        # Route 3: Contact Service
        - id: contact-service-routes
          uri: ${CONTACT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/contact,/api/v1/contact/**

CONTENT_SERVICE_URL: http://localhost:8081
BUSINESS_SERVICE_URL: http://localhost:8082
CONTACT_SERVICE_URL: http://localhost:8083
