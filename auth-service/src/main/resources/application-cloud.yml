# Google Cloud Run production configuration
server:
  port: ${PORT:8084}

storage:
  type: ${STORAGE_TYPE:GCS}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:}
    json-path: ${GCS_JSON_PATH:auth/linkedin-users.json}
    excel-path: ${GCS_EXCEL_PATH:auth/Companies_Details.xlsx}

linkedin:
  redirect-uri: ${LINKEDIN_REDIRECT_URI:https://www.hamarashops.ai/api/v1/auth/linkedin/callback}

app:
  frontend-url: ${FRONTEND_URL:https://hamarashops.com}
  cookie-secure: true
