apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: auth-service
  labels:
    cloud.googleapis.com/location: <REGION>
    app.kubernetes.io/name: auth-service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT_ID>/<IMAGE_REPOSITORY>/auth-service:<IMAGE_TAG>
          ports:
            - name: http1
              containerPort: 8084
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
            - name: LINKEDIN_CLIENT_ID
              value: "<LINKEDIN_CLIENT_ID>"
            - name: LINKEDIN_REDIRECT_URI
              value: "https://hamarashops.com/api/v1/auth/linkedin/callback"
            - name: FRONTEND_URL
              value: "https://hamarashops.com"
            - name: COOKIE_SECURE
              value: "true"
            - name: STORAGE_TYPE
              value: "GCS"
            - name: GCS_BUCKET_NAME
              value: "<GCS_BUCKET_NAME>"
            - name: GCS_JSON_PATH
              value: "auth/linkedin-users.json"
            - name: GCS_EXCEL_PATH
              value: "auth/Companies_Details.xlsx"
            - name: LINKEDIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkedin-client-secret
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
