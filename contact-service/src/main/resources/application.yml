server:
  port: ${PORT:8083}

spring:
  application:
    name: contact-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

resend:
  api:
    key: ${RESEND_API_KEY:}
  from: ${CONTACT_FROM_EMAIL:${RESEND_FROM:onboarding@resend.dev}}

contact:
  recipient: ${NOTIFICATION_TO_EMAIL:${CONTACT_RECIPIENT:info@hamarashops.ai}}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
