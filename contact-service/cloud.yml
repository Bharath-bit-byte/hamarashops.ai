apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: contact-service
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/hamarashops-ai/services/contact-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
            - name: NOTIFICATION_TO_EMAIL
              value: "info@hamarashops.ai"
            - name: CONTACT_FROM_EMAIL
              value: "HamaraShops.ai <onboarding@resend.dev>"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resend-api-key
                  key: latest
          resources:
            limits:
              memory: 512Mi
              cpu: 1000m
